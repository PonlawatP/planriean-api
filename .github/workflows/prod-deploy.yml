# PROD pipeline for the Planriean API (express×2 + elysia×2 + nginx).
# Image is built on the VPN host 10.11.10.1 by docker compose (same as the
# manual deploy); runtime env comes from the untracked .env in the checkout.
#
# GitHub Environment `prod` provides:
#   vars.PR_DEPLOY_SSH_USER
#   secrets.PR_DEPLOY_SSH_KEY
#
# Checkout: /home/pluto/Planriean/planriean-api
#
# Discord: one progress message (embed) is created at the start and PATCHed
# after each stage. The last update rewrites that same message as the final summary.

name: PROD — Deploy API

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, lab, normal-server]
    environment: prod
    steps:
      - name: Load Secrets from Local File
        run: |
          [ -f /opt/cicd-secrets/.env ] && cat /opt/cicd-secrets/.env >> $GITHUB_ENV || echo "no /opt/cicd-secrets/.env; skipping"

      - name: Map DISCORD_WEBHOOK for Discord
        run: |
          if [ -n "${DISCORD_WEBHOOK_URL:-}" ] && [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_WEBHOOK=$DISCORD_WEBHOOK_URL" >> $GITHUB_ENV
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discord — progress (pipeline started)
        id: discord_progress_start
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        env:
          DISCORD_WEBHOOK: ${{ env.DISCORD_WEBHOOK }}
        run: |
          .github/scripts/discord.sh init "$DISCORD_WEBHOOK" "PR API — PROD pipeline"

      - name: Sync checkout on VPN host
        id: sync
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 10.11.10.1
          username: ${{ vars.PR_DEPLOY_SSH_USER }}
          key: ${{ secrets.PR_DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/pluto/Planriean/planriean-api
            git fetch --prune origin main
            git reset --hard origin/main

      - name: Discord — progress (sync finished)
        if: ${{ steps.sync.outcome == 'success' && steps.discord_progress_start.outputs.discord_message_id != '' }}
        env:
          DISCORD_WEBHOOK: ${{ env.DISCORD_WEBHOOK }}
          MSG_ID: ${{ steps.discord_progress_start.outputs.discord_message_id }}
        run: |
          .github/scripts/discord.sh patch \
            "$DISCORD_WEBHOOK" \
            "$MSG_ID" \
            3447003 \
            "PR API — PROD pipeline" \
            "✅ Synced" \
            "⏳ docker compose up --build…"

      - name: Build and compose up on VPN host
        id: compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 10.11.10.1
          username: ${{ vars.PR_DEPLOY_SSH_USER }}
          key: ${{ secrets.PR_DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /home/pluto/Planriean/planriean-api
            docker compose up -d --build
            docker image prune -f

      - name: Discord — final summary
        if: ${{ always() && steps.discord_progress_start.outputs.discord_message_id != '' }}
        env:
          DISCORD_WEBHOOK: ${{ env.DISCORD_WEBHOOK }}
          MSG_ID: ${{ steps.discord_progress_start.outputs.discord_message_id }}
        run: |
          .github/scripts/discord.sh done \
            "$DISCORD_WEBHOOK" \
            "$MSG_ID" \
            "PR API — PROD finished" \
            "${{ steps.sync.outcome }}" \
            "${{ steps.compose.outcome }}"
